[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Seed prompts are natural-language data; wrapping them mid-sentence hurts more than long lines do.
"scripts/seed_demo.py" = ["E501"]
