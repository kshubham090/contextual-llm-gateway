[project]
name = "contextual-llm-gateway"
version = "0.3.0"
description = "A scoped, observable LLM gateway with graph memory and batched embeddings"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, Neo4j and Redis services (opt-in)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
