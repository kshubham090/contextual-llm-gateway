name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install locked runtime and development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate synthetic fixtures without credentials
        run: python scripts/evaluate.py validate
      - name: Offline contract tests
        run: pytest -q -m "not integration"
      - name: Install and test the source Python client
        run: |
          python -m pip install -e './sdk/python[test]'
          python -m pytest sdk/python/tests -q
      - name: Exercise the synthetic batching benchmark
        run: python scripts/benchmark_embeddings.py --requests 64 --concurrency 16 --output artifacts/batching-synthetic.json
      - uses: actions/upload-artifact@v4
        with:
          name: batching-mechanism-python-${{ matrix.python }}
          path: artifacts/batching-synthetic.json
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock --strict

  typescript-and-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript test
      - run: node --test tests/browser/*.test.mjs
      - name: Verify publishable client contents
        working-directory: sdk/typescript
        run: npm pack --dry-run

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the default non-root image
        run: docker build --tag contextual-gateway:ci .
      - name: Verify image user and migration files
        run: docker run --rm --entrypoint python contextual-gateway:ci -c 'import os,pathlib; assert os.getuid() != 0; assert list(pathlib.Path("/srv/migrations").glob("*.sql"))'
